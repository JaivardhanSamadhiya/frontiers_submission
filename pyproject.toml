[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precisionphage"
version = "2.0.0"
description = "Leakage-free phage-host interaction prediction, cocktail optimization, and temporal resistance modeling."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "biopython>=1.81",
    "networkx>=3.1",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "torch>=2.1",
    "torch-geometric>=2.4",
    "xgboost>=2.0",
]

[project.optional-dependencies]
extras = ["shap", "umap-learn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.precisionphage]
# Reproducibility note: the canonical runtime is the project .venv
# (Python 3.11, torch 2.12 CPU, PyG 2.8). See configs/default.yaml for all knobs.
