name: release-checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install revision audit dependencies
        run: python -m pip install -r reproducibility/requirements-revision-audit.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Screening diagnostic function tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_screening_diagnostics.py -q
      - name: Frozen release audit
        run: python experiments/00_validate_release.py --allow-missing-genomes
