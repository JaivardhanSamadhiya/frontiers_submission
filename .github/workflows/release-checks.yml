name: release-checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install revision audit dependencies
        run: python -m pip install -r reproducibility/requirements-revision-audit.txt
      - name: Unit tests (45 supplied study cases)
        run: python -m unittest discover -s tests -v
      - name: Screening diagnostic function tests (4 cases)
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_screening_diagnostics.py -q
      - name: Frozen release audit
        run: python experiments/00_validate_release.py --allow-missing-genomes
      - name: Public payload checksums
        run: python reproducibility/verify_public_snapshot.py
      - name: Saved prediction and model checks
        run: python reproducibility/verify_saved_predictions.py
      - name: Strengthening extension exact payload hashes
        run: python scripts/frontiers_strengthening_2026_10_16/scientific_extension_payload.py --verify-stage --stage-root . --allow-additional-files
      - name: Measured-menu tests
        run: python -m unittest discover -s scripts/frontiers_strengthening_2026_10_16 -p test_doublet_validation.py -v
      - name: Strengthening saved models, grouped selections and independent metrics
        run: python -B scripts/frontiers_strengthening_2026_10_16/verify_extension_analysis.py
      - name: Synthetic train-only scaler guard
        run: python -B scripts/frontiers_strengthening_2026_10_16/model_verify.py --read-only
      - name: Negative-MCC retention repair cases
        run: python -B -m pytest tests/test_genophi_retention.py -q -p no:cacheprovider
      - name: Full-budget comparator compact metric replay
        run: python scripts/frontiers_strengthening_2026_10_16/verify_comparator_metrics.py
